name: Go Test

on:
  push:
    paths:
      - 'go-api/**'
  pull_request:
    paths:
      - 'go-api/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_anomaly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-api/go.mod
          cache: true
          cache-dependency-path: go-api/go.sum

      - name: Run unit tests
        working-directory: go-api
        run: go test -race -short ./...

      - name: Run integration tests
        working-directory: go-api
        run: go test -race ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stock_anomaly_test?sslmode=disable

      - name: Build
        working-directory: go-api
        run: go build ./...
